<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休假日產生器-V1</title>
    <style>
        /* ==================== 字體 ==================== */
        @font-face {
            font-family: 'LocalBerlinFont';
            src: url('BRLNSDB.TTF') format('truetype'),
                 url('brlnsdb.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }
        @import url('https://fonts.googleapis.com/css2?family=League+Spartan:wght@800;900&display=swap');

        body {
            font-family: 'LocalBerlinFont', 'League Spartan', 'Berlin Sans FB Demi-Bold', 'Arial Black', "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 20px 15px;
            background: #8a8a8a;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* ==================== 控制區 ==================== */
        .controls {
            margin-bottom: 25px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 460px;
            width: 100%;
            box-sizing: border-box;
        }

        .inputs-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .controls label {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .controls input,
        .controls select {
            font-size: 18px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .controls button {
            font-size: 16px;
            font-weight: bold;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-standard { background-color: #28a745; color: white; }
        .btn-fb { background-color: #007bff; color: white; }
        .controls button:hover { opacity: 0.9; }

        /* ==================== 日曆圖卡 ==================== */
        .capture-area {
            background: #8a8a8a;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            max-width: 460px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-radius: 8px;
        }

        .fb-mode { padding: 15px 30px 30px 30px !important; }
        .fb-mode .year-header { margin-top: 0px !important; margin-bottom: 10px !important; }
        .fb-mode .month-header { margin-bottom: 14px !important; }

        .year-header {
            font-size: 68px;
            font-weight: 900;
            color: #000000;
            line-height: 1;
            margin-top: 5px;
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            letter-spacing: -1px;
        }

        .calendar-container {
            width: 100%;
            background: #ffffff;
            padding: 35px 25px 40px 25px;
            border-radius: 35px;
            text-align: center;
            box-sizing: border-box;
        }

        .month-header { font-size: 48px; font-weight: bold; color: #000000; margin-bottom: 25px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 22px;
            column-gap: 2px;
            width: 100%;
        }

        .weekday-label { color: #909090; font-weight: bold; font-size: 28px; padding-bottom: 5px; }

        .day-cell {
            position: relative;
            font-size: 34px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            user-select: none;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .empty-cell { height: 55px; }

        .day-cell.holiday::after {
            content: '休';
            position: absolute;
            bottom: -6px;
            font-size: 13px;
            color: #e60000;
            border: 2px solid #e60000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 16px;
            text-align: center;
            font-weight: bold;
            font-family: "Microsoft JhengHei", sans-serif;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="inputs-group">
            <label>
                年:
                <input type="number" id="year" value="2026" style="width:75px;" oninput="renderCalendar()" onchange="renderCalendar()">
            </label>
            <label>
                月:
                <select id="month" onchange="renderCalendar()" style="font-size: 18px; padding: 6px;"></select>
            </label>
            <label>
                起始:
                <select id="startDay" onchange="renderCalendar()">
                    <option value="1">星期一</option>
                    <option value="0">星期日</option>
                </select>
            </label>
        </div>
        <div class="btn-group">
            <button class="btn-standard" onclick="generateStandardImage()">📥 1. 下載標準圖卡</button>
            <button class="btn-fb" onclick="generateFBImage()">📷 2. 下載 FB 貼文直式長圖</button>
        </div>
    </div>

    <div id="captureArea" class="capture-area">
        <div class="year-header" id="yearText">2026</div>
        <div class="calendar-container">
            <div class="month-header" id="monthText">6月</div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <script>
        function initDefaultDate() {
            const today = new Date();
