<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>簡單海報製作 (v1.1.0 自訂顏色去背版)</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      background-color: #c0ab79;
      color: #2c2416;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .app-header {
      background: rgba(255, 255, 255, 0.5);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(60, 45, 20, 0.15);
    }

    .app-header h1 {
      font-size: 17px;
      font-weight: bold;
      color: #3a2e18;
    }

    .version-tag {
      font-size: 11px;
      color: #6c5d47;
      background: rgba(255, 255, 255, 0.85);
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* 全局常駐操作按鈕區 (頂部 4 按鈕) */
    .global-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid rgba(60, 45, 20, 0.2);
    }

    .global-actions button {
      height: 38px;
      padding: 2px;
      font-size: 13px;
      border-radius: 6px;
    }

    .tab-bar {
      display: flex;
      background: rgba(60, 45, 20, 0.15);
      border-bottom: 2px solid rgba(60, 45, 20, 0.2);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: #4a3b22;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.75);
      color: #000000;
      border-bottom: 3px solid #d97706;
    }

    .control-panel {
      background: rgba(255, 255, 255, 0.65);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    .form-row label {
      font-size: 13px;
      color: #2c2416;
      white-space: nowrap;
      font-weight: bold;
    }

    .compact-field {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    button, input[type="file"], input[type="color"], input[type="text"], input[type="number"], select {
      width: 100%;
      height: 38px;
      padding: 4px 6px;
      border: 1px solid rgba(60, 45, 20, 0.35);
      border-radius: 6px;
      font-size: 14px;
      background: #ffffff;
      color: #2c2416;
    }

    input[type="range"] {
      width: 100%;
      height: 24px;
    }

    input[type="file"] { padding: 6px; height: auto; }
    input[type="color"] { padding: 2px; cursor: pointer; min-width: 32px; }

    .btn-action { background: #4a3b22; color: #ffffff; font-weight: bold; }
    .btn-magic { background: #d97706; color: #ffffff; font-weight: bold; }
    .btn-delete { background: #a83232; color: #ffffff; font-weight: bold; }
    .btn-download { background: #2d7a42; color: #ffffff; font-weight: bold; }
    .btn-layer { background: #3b6282; color: #ffffff; font-weight: bold; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 8px;
    }

    .canvas-container-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      font-size: 12px;
      color: #3a2e18;
      font-weight: bold;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      border-radius: 6px;
      text-align: center;
    }

    .bg-controls {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.5);
      padding: 8px;
      border-radius: 8px;
      border: 1px dashed rgba(60, 45, 20, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>簡單海報製作</h1>
    <span class="version-tag">v1.1.0 自訂去背色版</span>
  </div>

  <!-- 置頂常駐功能列 -->
  <div class="global-actions">
    <button id="bringToFrontBtn" class="btn-layer">🔝 移至最前</button>
    <button id="sendToBackBtn" class="btn-layer">⬇️ 移至最後</button>
    <button id="deleteBtn" class="btn-delete">🗑️ 刪除選取</button>
    <button id="downloadBtn" class="btn-download">💾 下載圖</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('canvasTab', this)">📐 底圖設定</button>
    <button class="tab-btn" onclick="switchTab('imageTab', this)">📷 上傳圖片</button>
    <button class="tab-btn" onclick="switchTab('textTab', this)">✍️ 編輯文字</button>
  </div>

  <div class="control-panel">
    
    <!-- 分頁 1: 設定底圖大小與底色 -->
    <div id="canvasTab" class="tab-content active">
      <div class="form-row">
        <div class="compact-field" style="flex: 0 0 75px;">
          <label>底色:</label>
          <input type="color" id="bgColorPicker" value="#ffffff">
        </div>
        <div class="compact-field">
          <label>寬:</label>
          <input type="number" id="canvasWidthInput" value="350" min="100" max="2000" step="10">
        </div>
        <div class="compact-field">
          <label>高:</label>
          <input type="number" id="canvasHeightInput" value="350" min="100" max="2000" step="10">
        </div>
        <button id="applyCanvasSizeBtn" class="btn-action" style="flex: 0 0 60px;">套用</button>
      </div>
    </div>

    <!-- 分頁 2: 上傳圖片與去背控制 -->
    <div id="imageTab" class="tab-content">
      <input type="file" id="imageInput" accept="image/*">
      
      <div id="bgControls" class="bg-controls">
        <div class="form-row">
          <label>目標去背色：</label>
          <input type="color" id="targetColorPicker" value="#ffffff" style="flex: 0 0 45px;">
          <button id="pickColorBtn" class="btn-action" style="flex: 1;">🧪 吸取去背色</button>
        </div>

        <div class="form-row">
          <label>靈敏度：</label>
          <input type="range" id="distanceRange" min="0.05" max="0.5" step="0.01" value="0.15">
          <span id="rangeVal" style="font-weight: bold; min-width: 35px; font-size: 13px;">0.15</span>
        </div>
        
        <button id="removeBgColorBtn" class="btn-magic">🪄 執行消除指定背景色</button>
      </div>

      <div id="status">點擊上方按鈕選擇圖片...</div>
    </div>

    <!-- 分頁 3: 文字部分 -->
    <div id="textTab" class="tab-content">
      <input type="text" id="textInput" placeholder="請輸入文字..." value="特惠商品 5 折起">
      
      <div class="form-row">
        <div class="compact-field" style="flex: 0 0 75px;">
          <label>顏色:</label>
          <input type="color" id="textColorPicker" value="#2c2416">
        </div>
        <div class="compact-field" style="flex: 0 0 85px;">
          <label>大小:</label>
          <input type="number" id="fontSizeInput" value="32" min="12" max="120">
        </div>
        <div class="compact-field">
          <select id="fontFamilySelect">
            <option value="Microsoft JhengHei">微軟正黑體</option>
            <option value="sans-serif">預設無襯線體</option>
            <option value="DFKai-SB">標楷體</option>
            <option value="PMingLiU">新細明體</option>
            <option value="Impact">Impact</option>
          </select>
        </div>
      </div>

      <button id="addTextBtn" class="btn-action">＋ 新增文字</button>
    </div>

  </div>

  <div class="main-content">
    <div class="canvas-container-wrapper">
      <canvas id="c" width="350" height="350"></canvas>
    </div>
  </div>

  <script>
    function switchTab(tabId, btnElement) {
      var contents = document.querySelectorAll('.tab-content');
      for (var i = 0; i < contents.length; i++) {
        contents[i].classList.remove('active');
      }
      var buttons = document.querySelectorAll('.tab-btn');
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].classList.remove('active');
      }

      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', function() {
      var canvas = new fabric.Canvas('c', {
        backgroundColor: '#ffffff'
      });

      var canvasWidthInput = document.getElementById('canvasWidthInput');
      var canvasHeightInput = document.getElementById('canvasHeightInput');
      var applyCanvasSizeBtn = document.getElementById('applyCanvasSizeBtn');

      function resizeCanvasForMobile() {
        var availableWidth = window.innerWidth - 20;
        var availableHeight = window.innerHeight - 340;
        var defaultSize = Math.max(Math.min(availableWidth, availableHeight, 500), 280);
        
        canvas.setWidth(defaultSize);
        canvas.setHeight(defaultSize);
        canvasWidthInput.value = defaultSize;
        canvasHeightInput.value = defaultSize;
        canvas.renderAll();
      }
      window.addEventListener('resize', resizeCanvasForMobile);
      resizeCanvasForMobile();

      applyCanvasSizeBtn.addEventListener('click', function() {
        var w = parseInt(canvasWidthInput.value, 10) || 350;
        var h = parseInt(canvasHeightInput.value, 10) || 350;
        canvas.setWidth(w);
        canvas.setHeight(h);
        canvas.renderAll();
      });

      var statusEl = document.getElementById('status');
      var imageInput = document.getElementById('imageInput');
      var removeBgColorBtn = document.getElementById('removeBgColorBtn');
      var bgControls = document.getElementById('bgControls');
      var distanceRange = document.getElementById('distanceRange');
      var rangeVal = document.getElementById('rangeVal');
      
      var targetColorPicker = document.getElementById('targetColorPicker');
      var pickColorBtn = document.getElementById('pickColorBtn');

      var deleteBtn = document.getElementById('deleteBtn');
      var bringToFrontBtn = document.getElementById('bringToFrontBtn');
      var sendToBackBtn = document.getElementById('sendToBackBtn');
      
      var textColorPicker = document.getElementById('textColorPicker');
      var fontSizeInput = document.getElementById('fontSizeInput');
      var fontFamilySelect = document.getElementById('fontFamilySelect');

      distanceRange.addEventListener('input', function(e) {
        rangeVal.innerText = e.target.value;
      });

      // 滴管吸色邏輯
      pickColorBtn.addEventListener('click', function() {
        if ('EyeDropper' in window) {
          const eyeDropper = new EyeDropper();
          eyeDropper.open().then(result => {
            targetColorPicker.value = result.sRGBHex;
            statusEl.innerText = "已選取背景色：" + result.sRGBHex + "，可點擊「執行消除」！";
          }).catch(e => {
            console.log("吸管取消或不支援");
          });
        } else {
          // 不支援滴管 API 時，直接觸發顏色選擇器
          targetColorPicker.click();
        }
      });

      imageInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
          var file = e.target.files[0];
          var url = URL.createObjectURL(file);

          fabric.Image.fromURL(url, function(img) {
            img.scaleToWidth(canvas.width * 0.7);
            canvas.add(img);
            canvas.centerObject(img);
            canvas.setActiveObject(img);
            statusEl.innerText = "圖片已上傳！請用「吸取去背色」選色後點擊去背。";
            bgControls.style.display = "flex";
          });
        }
      });

      // 去除指定顏色
      removeBgColorBtn.addEventListener('click', function() {
        var activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'image') {
          activeObj.filters = [];
          var threshold = parseFloat(distanceRange.value);
          var selectedColor = targetColorPicker.value;

          var filter = new fabric.Image.filters.RemoveColor({
            color: selectedColor,
            distance: threshold
          });
          
          activeObj.filters.push(filter);
          activeObj.applyFilters();
          canvas.renderAll();
          statusEl.innerText = "去背完成！（消除顏色: " + selectedColor + ", 靈敏度: " + threshold + "）";
        } else {
          alert("請先點選畫布上的圖片！");
        }
      });

      document.getElementById('addTextBtn').addEventListener('click', function() {
        var val = document.getElementById('textInput').value || '預設文字';
        var text = new fabric.Text(val, {
          left: canvas.width / 4,
          top: canvas.height / 4,
          fontSize: parseInt(fontSizeInput.value, 10) || 32,
          fill: textColorPicker.value,
          fontFamily: fontFamilySelect.value,
          fontWeight: 'bold'
        });
        canvas.add(text);
        canvas.setActiveObject(text);
      });

      canvas.on('selection:created', updateControlPanel);
      canvas.on('selection:updated', updateControlPanel);

      function updateControlPanel() {
        var activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          textColorPicker.value = activeObj.fill;
          fontSizeInput.value = activeObj.fontSize;
          fontFamilySelect.value = activeObj.fontFamily;
        }
      }

      textColorPicker.addEventListener('input', function(e) {
        var activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fill', e.target.value);
          canvas.renderAll();
        }
      });

      fontSizeInput.addEventListener('input', function(e) {
        var activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fontSize', parseInt(e.target.value, 10) || 20);
          canvas.renderAll();
        }
      });

      fontFamilySelect.addEventListener('change', function(e) {
        var activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fontFamily', e.target.value);
          canvas.renderAll();
        }
      });

      // 圖層控制
      bringToFrontBtn.addEventListener('click', function() {
        var activeObj = canvas.getActiveObject();
        if (activeObj) {
          canvas.bringToFront(activeObj);
          canvas.renderAll();
        } else {
          alert("請先點選畫布上的物件！");
        }
      });

      sendToBackBtn.addEventListener('click', function() {
        var activeObj = canvas.getActiveObject();
        if (activeObj) {
          canvas.sendToBack(activeObj);
          canvas.renderAll();
        } else {
          alert("請先點選畫布上的物件！");
        }
      });

      deleteBtn.addEventListener('click', function() {
        var activeObjects = canvas.getActiveObjects();
        if (activeObjects && activeObjects.length > 0) {
          activeObjects.forEach(function(obj) { canvas.remove(obj); });
          canvas.discardActiveObject();
          canvas.requestRenderAll();
        } else {
          alert("請先點選畫布上要刪除的物件！");
        }
      });

      document.getElementById('bgColorPicker').addEventListener('input', function(e) {
        canvas.setBackgroundColor(e.target.value, function() {
          canvas.renderAll();
        });
      });

      document.getElementById('downloadBtn').addEventListener('click', function() {
        var dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
        var link = document.createElement('a');
        link.download = '海報設計.png';
        link.href = dataURL;
        link.click();
      });
    });
  </script>
</body>
</html>
