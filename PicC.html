<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>純前端 AI 去背與圖文合成工具</title>
  
  <!-- 1. 載入 Fabric.js (畫布套件) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #c0ab79;
      color: #2c2416;
      display: flex;
      min-height: 100vh;
    }
    
    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    h2 {
      font-size: 20px;
      color: #3a2e18;
      border-bottom: 2px solid rgba(60, 45, 20, 0.2);
      padding-bottom: 8px;
    }

    .panel-group {
      background: rgba(255, 255, 255, 0.35);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .panel-group h3 {
      font-size: 13px;
      color: #4a3b22;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button, input[type="file"], input[type="color"], input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid rgba(60, 45, 20, 0.25);
      border-radius: 6px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.8);
      color: #2c2416;
    }

    button {
      background: #4a3b22;
      color: #ffffff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #352a17; }
    button:disabled { background: rgba(100, 85, 60, 0.4); cursor: not-allowed; }

    .btn-delete { background: #a83232; }
    .btn-delete:hover { background: #872424; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: auto;
    }

    .canvas-container-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    #status {
      font-size: 12px;
      color: #4a3b22;
      word-break: break-all;
      margin-top: 8px;
      line-height: 1.4;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
        height: auto;
        overflow-y: auto;
      }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        padding: 15px;
      }
      .main-content {
        width: 100%;
        padding: 15px;
      }
      .canvas-container-wrapper {
        max-width: 100%;
        touch-action: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <h2>AI 圖文工作室</h2>

      <!-- 1. 去背區塊 -->
      <div class="panel-group">
        <h3>1. 匯入圖片</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button id="removeBgBtn" disabled>執行 AI 去背並加入畫布</button>
        <button id="addDirectBtn" style="background:#6c5d47;" disabled>不去背直接加入</button>
        <div id="status">請先選擇圖片...</div>
      </div>

      <!-- 2. 排版編輯區塊 -->
      <div class="panel-group">
        <h3>2. 圖層與文字編輯</h3>
        <input type="text" id="textInput" placeholder="輸入標題或內文..." value="特惠商品 5 折起">
        <button id="addTextBtn">新增文字圖層</button>
        <button id="deleteBtn" class="btn-delete" style="margin-top: 10px;">刪除選取圖層</button>
      </div>

      <!-- 3. 背景與匯出 -->
      <div class="panel-group">
        <h3>3. 畫布設定與匯出</h3>
        <label style="font-size: 12px; color: #4a3b22;">背景顏色：</label>
        <input type="color" id="bgColorPicker" value="#ffffff">
        <button id="downloadBtn" style="background: #2d7a42; margin-top: 12px;">匯出 PNG 成品</button>
      </div>
    </div>

    <div class="main-content">
      <div class="canvas-container-wrapper">
        <canvas id="c" width="500" height="500"></canvas>
      </div>
    </div>
  </div>

  <!-- 2. 載入 @imgly/background-removal 模組 -->
  <script type="module">
    import removeBackground from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.mjs';

    // 確保 DOM 載入後才執行 Javascript 邏輯
    window.addEventListener('DOMContentLoaded', () => {
      // 初始化 Fabric 畫布
      const canvas = new fabric.Canvas('c', {
        backgroundColor: '#ffffff'
      });

      // 手機寬度自適應
      function resizeCanvasForMobile() {
        const screenWidth = window.innerWidth;
        if (screenWidth < 540) {
          const newSize = screenWidth - 40;
          canvas.setWidth(newSize);
          canvas.setHeight(newSize);
          canvas.renderAll();
        }
      }
      window.addEventListener('resize', resizeCanvasForMobile);
      resizeCanvasForMobile();

      const statusEl = document.getElementById('status');
      const imageInput = document.getElementById('imageInput');
      const removeBgBtn = document.getElementById('removeBgBtn');
      const addDirectBtn = document.getElementById('addDirectBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      let currentFile = null;

      // 1. 選擇檔案
      imageInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          currentFile = e.target.files[0];
          removeBgBtn.disabled = false;
          addDirectBtn.disabled = false;
          statusEl.innerText = "圖片已選擇，點擊「執行 AI 去背」或「直接加入」。";
        }
      });

      // 2. AI 去背邏輯
      removeBgBtn.addEventListener('click', async () => {
        if (!currentFile) return;

        removeBgBtn.disabled = true;
        statusEl.innerText = "AI 去背計算中（第一次需要下載資源，請稍候）...";

        try {
          const blob = await removeBackground(currentFile, {
            progress: (key, current, total) => {
              const pct = Math.round((current / total) * 100) || 0;
              statusEl.innerText = `下載 AI 模組中... ${pct}%`;
            }
          });

          const url = URL.createObjectURL(blob);

          fabric.Image.fromURL(url, (fabricImg) => {
            fabricImg.scaleToWidth(canvas.width * 0.6);
            canvas.add(fabricImg);
            canvas.centerObject(fabricImg);
            canvas.setActiveObject(fabricImg);
            statusEl.innerText = "去背成功並已加入畫布！";
            removeBgBtn.disabled = false;
          });
        } catch (err) {
          statusEl.innerText = "去背失敗，請檢查網路連線。";
          console.error(err);
          removeBgBtn.disabled = false;
        }
      });

      // 3. 不去背直接加入圖片
      addDirectBtn.addEventListener('click', () => {
        if (!currentFile) return;
        const imageUrl = URL.createObjectURL(currentFile);
        fabric.Image.fromURL(imageUrl, (fabricImg) => {
          fabricImg.scaleToWidth(canvas.width * 0.6);
          canvas.add(fabricImg);
          canvas.centerObject(fabricImg);
          canvas.setActiveObject(fabricImg);
          statusEl.innerText = "圖片已加入畫布！";
        });
      });

      // 4. 新增文字圖層
      document.getElementById('addTextBtn').addEventListener('click', () => {
        const val = document.getElementById('textInput').value || '預設標題';
        const text = new fabric.Text(val, {
          left: canvas.width / 4,
          top: 50,
          fontSize: 28,
          fontWeight: 'bold',
          fill: '#2c2416'
        });
        canvas.add(text);
        canvas.setActiveObject(text);
      });

      // 5. 刪除圖層邏輯
      function deleteActiveObject() {
        const activeObjects = canvas.getActiveObjects();
        if (activeObjects && activeObjects.length > 0) {
          activeObjects.forEach((obj) => canvas.remove(obj));
          canvas.discardActiveObject();
          canvas.requestRenderAll();
        }
      }

      deleteBtn.addEventListener('click', deleteActiveObject);

      window.addEventListener('keydown', (e) => {
        if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT') {
          deleteActiveObject();
        }
      });

      // 6. 背景顏色切換
      document.getElementById('bgColorPicker').addEventListener('input', (e) => {
        canvas.setBackgroundColor(e.target.value, () => canvas.renderAll());
      });

      // 7. 匯出 PNG 檔
      document.getElementById('downloadBtn').addEventListener('click', () => {
        const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
        const link = document.createElement('a');
        link.download = '合成設計圖.png';
        link.href = dataURL;
        link.click();
      });
    });
  </script>
</body>
</html>
