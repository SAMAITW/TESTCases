<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>純前端 AI 去背與圖文合成工具 (v1.0.2)</title>
  
  <!-- 1. 載入 Fabric.js (繪圖畫布套件) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #c0ab79;
      color: #2c2416;
      display: flex;
      min-height: 100vh;
    }
    
    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    h2 {
      font-size: 20px;
      color: #3a2e18;
      border-bottom: 2px solid rgba(60, 45, 20, 0.2);
      padding-bottom: 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .version-tag {
      font-size: 12px;
      color: #6c5d47;
      font-weight: normal;
      background: rgba(255, 255, 255, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(60, 45, 20, 0.15);
    }

    .panel-group {
      background: rgba(255, 255, 255, 0.35);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .panel-group h3 {
      font-size: 13px;
      color: #4a3b22;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }

    .form-row label {
      font-size: 12px;
      color: #4a3b22;
      white-space: nowrap;
      min-width: 60px;
    }

    button, input[type="file"], input[type="color"], input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border: 1px solid rgba(60, 45, 20, 0.25);
      border-radius: 6px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.85);
      color: #2c2416;
    }

    button {
      background: #4a3b22;
      color: #ffffff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      padding: 10px;
      margin-top: 8px;
    }

    button:hover { background: #352a17; }
    button:disabled { background: rgba(100, 85, 60, 0.4); cursor: not-allowed; }

    .btn-delete { background: #a83232; }
    .btn-delete:hover { background: #872424; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: auto;
    }

    .canvas-container-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    .version-footer {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(60, 45, 20, 0.7);
      text-align: center;
      font-weight: 500;
    }

    #status {
      font-size: 12px;
      color: #4a3b22;
      word-break: break-all;
      margin-top: 8px;
      line-height: 1.4;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
        height: auto;
        overflow-y: auto;
      }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        padding: 15px;
      }
      .main-content {
        width: 100%;
        padding: 15px;
      }
      .canvas-container-wrapper {
        max-width: 100%;
        touch-action: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <h2>
        <span>AI 圖文工作室</span>
        <span class="version-tag">v1.0.2</span>
      </h2>

      <!-- 1. 去背區塊 -->
      <div class="panel-group">
        <h3>1. 匯入圖片</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button id="removeBgBtn" disabled>執行 AI 去背並加入畫布</button>
        <button id="addDirectBtn" style="background:#6c5d47;" disabled>不去背直接加入</button>
        <div id="status">準備載入 AI 去背模組...</div>
      </div>

      <!-- 2. 排版編輯區塊 -->
      <div class="panel-group">
        <h3>2. 圖層與文字編輯</h3>
        <input type="text" id="textInput" placeholder="輸入標題或內文..." value="特惠商品 5 折起">
        
        <div class="form-row">
          <label>文字顏色：</label>
          <input type="color" id="textColorPicker" value="#2c2416">
        </div>

        <div class="form-row">
          <label>字型大小：</label>
          <input type="number" id="fontSizeInput" value="28" min="12" max="120">
        </div>

        <div class="form-row">
          <label>選擇字體：</label>
          <select id="fontFamilySelect">
            <option value="sans-serif">預設無襯線體 (Sans-Serif)</option>
            <option value="Microsoft JhengHei">微軟正黑體</option>
            <option value="DFKai-SB">標楷體</option>
            <option value="PMingLiU">新細明體</option>
            <option value="Impact">粗體英文 (Impact)</option>
            <option value="Georgia">優雅襯線體 (Georgia)</option>
          </select>
        </div>

        <button id="addTextBtn">新增文字圖層</button>
        <button id="deleteBtn" class="btn-delete" style="margin-top: 8px;">刪除選取圖層</button>
      </div>

      <!-- 3. 背景與匯出 -->
      <div class="panel-group">
        <h3>3. 畫布設定與匯出</h3>
        <div class="form-row">
          <label>背景顏色：</label>
          <input type="color" id="bgColorPicker" value="#ffffff">
        </div>
        <button id="downloadBtn" style="background: #2d7a42; margin-top: 10px;">匯出 PNG 成品</button>
      </div>
    </div>

    <div class="main-content">
      <div class="canvas-container-wrapper">
        <canvas id="c" width="500" height="500"></canvas>
      </div>
      <div class="version-footer">
        當前部署版本：<strong style="color: #2c2416;">v1.0.2</strong> (更新時間: 2026-08-29)
      </div>
    </div>
  </div>

  <script>
    console.log("【PicC.html】已載入版本：v1.0.2");

    let removeBackground = null;

    // 非同步載入 AI 去背套件
    async function loadAiModule() {
      const statusEl = document.getElementById('status');
      try {
        const module = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.mjs');
        removeBackground = module.default;
        statusEl.innerText = "AI 去背模組已就緒，請選擇圖片。";
      } catch (err) {
        console.warn("AI 模組網路阻擋，切換為基礎繪圖模式：", err);
        statusEl.innerText = "AI 去背套件受阻，仍可直接新增圖片與文字。";
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadAiModule();

      const canvas = new fabric.Canvas('c', {
        backgroundColor: '#ffffff'
      });

      function resizeCanvasForMobile() {
        const screenWidth = window.innerWidth;
        if (screenWidth < 540) {
          const newSize = screenWidth - 40;
          canvas.setWidth(newSize);
          canvas.setHeight(newSize);
          canvas.renderAll();
        }
      }
      window.addEventListener('resize', resizeCanvasForMobile);
      resizeCanvasForMobile();

      const statusEl = document.getElementById('status');
      const imageInput = document.getElementById('imageInput');
      const removeBgBtn = document.getElementById('removeBgBtn');
      const addDirectBtn = document.getElementById('addDirectBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      
      const textColorPicker = document.getElementById('textColorPicker');
      const fontSizeInput = document.getElementById('fontSizeInput');
      const fontFamilySelect = document.getElementById('fontFamilySelect');

      let currentFile = null;

      imageInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
          currentFile = e.target.files[0];
          removeBgBtn.disabled = false;
          addDirectBtn.disabled = false;
          statusEl.innerText = "圖片已選擇，點擊「執行 AI 去背」或「直接加入」。";
        }
      });

      // 1. AI 去背
      removeBgBtn.addEventListener('click', async function() {
        if (!currentFile) return;

        if (!removeBackground) {
          alert("AI 模組尚未載入完畢或被網路封鎖，請改用「不去背直接加入」。");
          return;
        }

        removeBgBtn.disabled = true;
        statusEl.innerText = "AI 去背計算中，請稍候...";

        try {
          const blob = await removeBackground(currentFile, {
            progress: (key, current, total) => {
              const pct = Math.round((current / total) * 100) || 0;
              statusEl.innerText = `下載 AI 模組資源中... ${pct}%`;
            }
          });

          const url = URL.createObjectURL(blob);

          fabric.Image.fromURL(url, function(fabricImg) {
            fabricImg.scaleToWidth(canvas.width * 0.6);
            canvas.add(fabricImg);
            canvas.centerObject(fabricImg);
            canvas.setActiveObject(fabricImg);
            statusEl.innerText = "去背成功並已加入畫布！";
            removeBgBtn.disabled = false;
          });
        } catch (err) {
          statusEl.innerText = "去背失敗，請檢查網路連線。";
          console.error(err);
          removeBgBtn.disabled = false;
        }
      });

      // 2. 不去背直接加入
      addDirectBtn.addEventListener('click', function() {
        if (!currentFile) return;
        const imageUrl = URL.createObjectURL(currentFile);
        fabric.Image.fromURL(imageUrl, function(fabricImg) {
          fabricImg.scaleToWidth(canvas.width * 0.6);
          canvas.add(fabricImg);
          canvas.centerObject(fabricImg);
          canvas.setActiveObject(fabricImg);
          statusEl.innerText = "圖片已加入畫布！";
        });
      });

      // 3. 新增文字圖層（採用目前選擇的顏色、大小與字型）
      document.getElementById('addTextBtn').addEventListener('click', function() {
        const val = document.getElementById('textInput').value || '預設標題';
        const text = new fabric.Text(val, {
          left: canvas.width / 4,
          top: 50,
          fontSize: parseInt(fontSizeInput.value, 10) || 28,
          fill: textColorPicker.value,
          fontFamily: fontFamilySelect.value,
          fontWeight: 'bold'
        });
        canvas.add(text);
        canvas.setActiveObject(text);
      });

      // 4. 即時修改畫面上已選取的文字屬性
      canvas.on('selection:created', updateSidebarFromText);
      canvas.on('selection:updated', updateSidebarFromText);

      function updateSidebarFromText() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          textColorPicker.value = activeObj.fill;
          fontSizeInput.value = activeObj.fontSize;
          fontFamilySelect.value = activeObj.fontFamily;
        }
      }

      textColorPicker.addEventListener('input', function(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fill', e.target.value);
          canvas.renderAll();
        }
      });

      fontSizeInput.addEventListener('input', function(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fontSize', parseInt(e.target.value, 10) || 20);
          canvas.renderAll();
        }
      });

      fontFamilySelect.addEventListener('change', function(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fontFamily', e.target.value);
          canvas.renderAll();
        }
      });

      // 5. 刪除圖層
      function deleteActiveObject() {
        const activeObjects = canvas.getActiveObjects();
        if (activeObjects && activeObjects.length > 0) {
          activeObjects.forEach(obj => canvas.remove(obj));
          canvas.discardActiveObject();
          canvas.requestRenderAll();
        }
      }

      deleteBtn.addEventListener('click', deleteActiveObject);

      window.addEventListener('keydown', function(e) {
        if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT') {
          deleteActiveObject();
        }
      });

      // 6. 背景顏色
      document.getElementById('bgColorPicker').addEventListener('input', function(e) {
        canvas.setBackgroundColor(e.target.value, function() {
          canvas.renderAll();
        });
      });

      // 7. 匯出 PNG
      document.getElementById('downloadBtn').addEventListener('click', function() {
        const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
        const link = document.createElement('a');
        link.download = '合成設計圖.png';
        link.href = dataURL;
        link.click();
      });
    });
  </script>
</body>
</html>
