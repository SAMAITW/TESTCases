<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>簡易圖文合成工具 (v1.0.3)</title>
  
  <!-- 載入 Fabric.js 畫布套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", sans-serif;
      background-color: #c0ab79;
      color: #2c2416;
      display: flex;
      min-height: 100vh;
    }
    
    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 340px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    h2 {
      font-size: 22px;
      color: #3a2e18;
      border-bottom: 2px solid rgba(60, 45, 20, 0.2);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .version-tag {
      font-size: 12px;
      color: #6c5d47;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(60, 45, 20, 0.2);
    }

    .panel-group {
      background: rgba(255, 255, 255, 0.45);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .panel-group h3 {
      font-size: 14px;
      color: #3a2e18;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .form-row label {
      font-size: 13px;
      color: #2c2416;
      white-space: nowrap;
      min-width: 70px;
      font-weight: 500;
    }

    button, input[type="file"], input[type="color"], input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid rgba(60, 45, 20, 0.3);
      border-radius: 6px;
      font-size: 14px;
      background: #ffffff;
      color: #2c2416;
    }

    button {
      background: #4a3b22;
      color: #ffffff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
    }

    button:hover { background: #352a17; }

    .btn-magic {
      background: #d97706;
    }
    .btn-magic:hover { background: #b45309; }

    .btn-delete { background: #a83232; }
    .btn-delete:hover { background: #872424; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: auto;
    }

    .canvas-container-wrapper {
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      border-radius: 12px;
      overflow: hidden;
    }

    .version-footer {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(60, 45, 20, 0.7);
      text-align: center;
      font-weight: 500;
    }

    #status {
      font-size: 13px;
      color: #4a3b22;
      margin-top: 8px;
      line-height: 1.4;
      font-weight: bold;
      background: rgba(255,255,255,0.5);
      padding: 6px 10px;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; height: auto; overflow-y: auto; }
      .sidebar { width: 100%; height: auto; padding: 15px; }
      .main-content { width: 100%; padding: 15px; }
      .canvas-container-wrapper { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <h2>
        <span>簡單海報製作</span>
        <span class="version-tag">v1.0.3</span>
      </h2>

      <!-- 1. 圖片區塊 -->
      <div class="panel-group">
        <h3>1. 上傳圖片</h3>
        <input type="file" id="imageInput" accept="image/*">
        <button id="removeBgColorBtn" class="btn-magic" style="display:none;">🪄 點選消除背景色</button>
        <div id="status">請先上傳圖片...</div>
      </div>

      <!-- 2. 文字編輯區塊 -->
      <div class="panel-group">
        <h3>2. 加字與樣式</h3>
        <input type="text" id="textInput" placeholder="請輸入文字..." value="特惠商品 5 折起">
        
        <div class="form-row">
          <label>文字顏色：</label>
          <input type="color" id="textColorPicker" value="#2c2416">
        </div>

        <div class="form-row">
          <label>文字大小：</label>
          <input type="number" id="fontSizeInput" value="32" min="12" max="120">
        </div>

        <div class="form-row">
          <label>選擇字體：</label>
          <select id="fontFamilySelect">
            <option value="Microsoft JhengHei">微軟正黑體</option>
            <option value="sans-serif">預設無襯線體</option>
            <option value="DFKai-SB">標楷體</option>
            <option value="PMingLiU">新細明體</option>
            <option value="Impact">粗體英文 (Impact)</option>
          </select>
        </div>

        <button id="addTextBtn">＋ 新增文字</button>
        <button id="deleteBtn" class="btn-delete">🗑️ 刪除選取項目</button>
      </div>

      <!-- 3. 背景與下載 -->
      <div class="panel-group">
        <h3>3. 底色與儲存</h3>
        <div class="form-row">
          <label>畫布底色：</label>
          <input type="color" id="bgColorPicker" value="#ffffff">
        </div>
        <button id="downloadBtn" style="background: #2d7a42; font-size: 16px;">💾 下載完成圖片</button>
      </div>
    </div>

    <div class="main-content">
      <div class="canvas-container-wrapper">
        <canvas id="c" width="500" height="500"></canvas>
      </div>
      <div class="version-footer">
        當前版本：<strong style="color: #2c2416;">v1.0.3 超簡易版</strong>
      </div>
    </div>
  </div>

  <script>
    console.log("【PicC.html】已載入最簡化版：v1.0.3");

    document.addEventListener('DOMContentLoaded', function() {
      const canvas = new fabric.Canvas('c', {
        backgroundColor: '#ffffff'
      });

      // RWD 自適應
      function resizeCanvasForMobile() {
        if (window.innerWidth < 540) {
          const newSize = window.innerWidth - 40;
          canvas.setWidth(newSize);
          canvas.setHeight(newSize);
          canvas.renderAll();
        }
      }
      window.addEventListener('resize', resizeCanvasForMobile);
      resizeCanvasForMobile();

      const statusEl = document.getElementById('status');
      const imageInput = document.getElementById('imageInput');
      const removeBgColorBtn = document.getElementById('removeBgColorBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      const textColorPicker = document.getElementById('textColorPicker');
      const fontSizeInput = document.getElementById('fontSizeInput');
      const fontFamilySelect = document.getElementById('fontFamilySelect');

      // 1. 選擇並直接載入圖片
      imageInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
          const file = e.target.files[0];
          const url = URL.createObjectURL(file);

          fabric.Image.fromURL(url, function(img) {
            img.scaleToWidth(canvas.width * 0.7);
            canvas.add(img);
            canvas.centerObject(img);
            canvas.setActiveObject(img);
            statusEl.innerText = "圖片已加入！如需去掉白底/單色背景，請點擊下方「消除背景色」。";
            removeBgColorBtn.style.display = "block";
          });
        }
      });

      // 2. 點擊消除背景色（去除白色/相近色）
      removeBgColorBtn.addEventListener('click', function() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'image') {
          // 使用 Fabric.js 內建的顏色過濾器消除背景
          const filter = new fabric.Image.filters.RemoveColor({
            color: '#FFFFFF', // 預設消除白色
            distance: 0.2     // 容許度
          });
          
          activeObj.filters.push(filter);
          activeObj.applyFilters();
          canvas.renderAll();
          statusEl.innerText = "已消除背景白色！";
        } else {
          alert("請先在右側畫布上點選要去背的圖片！");
        }
      });

      // 3. 新增文字
      document.getElementById('addTextBtn').addEventListener('click', function() {
        const val = document.getElementById('textInput').value || '預設文字';
        const text = new fabric.Text(val, {
          left: canvas.width / 4,
          top: 60,
          fontSize: parseInt(fontSizeInput.value, 10) || 32,
          fill: textColorPicker.value,
          fontFamily: fontFamilySelect.value,
          fontWeight: 'bold'
        });
        canvas.add(text);
        canvas.setActiveObject(text);
      });

      // 4. 選取物件時自動同步樣式
      canvas.on('selection:created', updateControlPanel);
      canvas.on('selection:updated', updateControlPanel);

      function updateControlPanel() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          textColorPicker.value = activeObj.fill;
          fontSizeInput.value = activeObj.fontSize;
          fontFamilySelect.value = activeObj.fontFamily;
        }
      }

      // 5. 即時修改選中文字
      textColorPicker.addEventListener('input', function(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fill', e.target.value);
          canvas.renderAll();
        }
      });

      fontSizeInput.addEventListener('input', function(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fontSize', parseInt(e.target.value, 10) || 20);
          canvas.renderAll();
        }
      });

      fontFamilySelect.addEventListener('change', function(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'text') {
          activeObj.set('fontFamily', e.target.value);
          canvas.renderAll();
        }
      });

      // 6. 刪除
      function deleteActiveObject() {
        const activeObjects = canvas.getActiveObjects();
        if (activeObjects && activeObjects.length > 0) {
          activeObjects.forEach(obj => canvas.remove(obj));
          canvas.discardActiveObject();
          canvas.requestRenderAll();
        }
      }

      deleteBtn.addEventListener('click', deleteActiveObject);

      // 7. 底色
      document.getElementById('bgColorPicker').addEventListener('input', function(e) {
        canvas.setBackgroundColor(e.target.value, function() {
          canvas.renderAll();
        });
      });

      // 8. 匯出 PNG
      document.getElementById('downloadBtn').addEventListener('click', function() {
        const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
        const link = document.createElement('a');
        link.download = '海報設計.png';
        link.href = dataURL;
        link.click();
      });
    });
  </script>
</body>
</html>
